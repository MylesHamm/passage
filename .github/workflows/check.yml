name: Check Passage
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Check Worker bundle without deploying
        run: npm run cloud:check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify the public Pages artifact
        run: npm run build:pages -- --out build/pages-check --base-path /passage/
