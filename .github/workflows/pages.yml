name: Publish reviewed Passage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passage-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Require a configured live-data service
        env:
          PASSAGE_API_BASE: ${{ vars.PASSAGE_API_BASE }}
        run: node --input-type=module -e "import {normalizeApiBase} from './dist/runtime-config.mjs'; if(!normalizeApiBase(process.env.PASSAGE_API_BASE)) throw Error('Set the PASSAGE_API_BASE repository variable before publishing.');"
      - name: Verify current core reporting
        env:
          PASSAGE_API_BASE: ${{ vars.PASSAGE_API_BASE }}
        run: node scripts/check-hosted-api.mjs
      - name: Build Pages
        env:
          PASSAGE_API_BASE: ${{ vars.PASSAGE_API_BASE }}
        run: npm run build:pages -- --out build/pages --base-path /passage/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
